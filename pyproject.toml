[project]
name = "namvis"
version = "0.1.0"
description = "NAMVIS: Next-Scale Autoregressive Multi-View Image Synthesis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.10.*"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "flash-attn==2.8.3.post1",
    "einops==0.8.2",
    "huggingface-hub==1.30.0",
    "lpips==0.1.4",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "pillow==11.3.0",
    "scikit-image==0.25.2",
    "timm==0.9.6",
    "tqdm==4.70.0",
    "trackio==0.40.0",
    "transformers==5.16.1",
    "typed-argument-parser==1.12.0",
    "wandb==0.16.6",
    "webdataset==1.0.2",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["infinity", "inference"]
module-root = ""

[tool.uv]
# Prebuilt CUDA wheels below exist only for Linux x86_64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1+cu12torch2.5cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
